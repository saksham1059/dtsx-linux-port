[package]
name = "dts_control_center"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1.0"
serde = { version = "1.0", features=["derive"] }

[build-dependencies]
cc = "1.0"
tauri-build = { version = "2", features = [] }

[features]
default = ["dev"]
dev = []

[profile.release]
strip = true
